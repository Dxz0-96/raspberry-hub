name: Bug report
description: Something in the hub or in the Raspberry Pi scripts does not work as described.
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please check the [troubleshooting table](../blob/main/README.md#troubleshooting) first.
        **Security problems do not go here**: see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
      placeholder: |
        I switched Wikipedia off from the hub, rebooted the Raspberry Pi and Wikipedia was on again.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open https://raspberry/
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Hub web interface
        - Maps or address search
        - Offline Wikipedia
        - Switches, login or added services
        - Installation, update or migration (hub-install.sh, hub-update.sh)
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Hub version
      description: Shown in the footer of the hub, for example "v1.0.0 · d724cc0".
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Raspberry Pi and system
      placeholder: Raspberry Pi 3 Model B, Debian 13 64-bit, Pi-hole v6.1
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox 150 on Android
  - type: textarea
    id: logs
    attributes:
      label: Output of sudo hub-check.sh and relevant logs
      description: For example `journalctl -u hub-control -n 50`. Remove anything private (IP addresses outside your LAN, passwords).
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
