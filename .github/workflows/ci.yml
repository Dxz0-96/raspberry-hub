name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:       # started by release.yml on the release pull request

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Commit convention
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the pull request title and its commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/check-commits.sh

  pi:
    name: Pi scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"     # the Python of Debian 13, which the Raspberry Pi runs
      - name: Syntax
        run: |
          python -m py_compile pi/*.py pi/hub-service pi/hub-control-setpass
          for f in pi/*.sh pi/hub-cert-sync; do bash -n "$f"; done
      - name: ShellCheck
        run: shellcheck --severity=warning pi/*.sh pi/hub-cert-sync .github/scripts/*.sh
      - name: Smoke tests (address index, upgrade from 1.x, hub-control API)
        run: python -m unittest discover -s pi/tests -v

  hub:
    name: Hub
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Smoke test
        run: npm run smoke
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npx playwright test
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            hub/playwright-report
            hub/test-results
          retention-days: 7
