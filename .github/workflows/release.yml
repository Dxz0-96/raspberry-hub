name: Release

# release-please reads the Conventional Commits merged into main and keeps a release pull request open
# ("chore(main): release X.Y.Z") that bumps the version everywhere and writes CHANGELOG.md. Merging that
# pull request tags vX.Y.Z and publishes the GitHub release. See CONTRIBUTING.md, "Releases".

on:
  push:
    branches: [main]

permissions:
  contents: write          # tags, releases, the release branch
  pull-requests: write     # the release pull request
  actions: write           # starts CI on the release pull request (see below)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Pull requests and pushes made with GITHUB_TOKEN do not start other workflows, so the required
      # checks would never run on the release pull request. A workflow_dispatch is allowed: it runs CI on
      # the release branch and the results show up on the pull request.
      - name: Run CI on the release pull request
        if: ${{ steps.release.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
