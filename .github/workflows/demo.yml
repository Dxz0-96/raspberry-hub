name: Demo

# Publishes the demo of the hub on GitHub Pages (https://<owner>.github.io/<repository>/): the site built with
# npm run demo, answering in the browser with made-up data (hub/lib/demo.ts). release.yml starts it on main after
# every release; it can also be run by hand from the Actions page. Needs Settings -> Pages -> Source:
# "GitHub Actions".
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the demo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Map fonts and icons
        run: npm run assets
      - name: Demo
        env:
          HUB_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run demo
      - uses: actions/upload-pages-artifact@v5
        with:
          path: hub/out-demo

  deploy:
    name: Publish on GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
