name: Release package

# Builds raspberry-hub-X.Y.Z.tar.gz (the pi/ folder with the website already built) and SHA256SUMS, proves
# with an artifact attestation that this repository's workflow built them, and attaches them to the GitHub
# release. release.yml calls it for every new release; it can also be run by hand for an existing tag.
# On the Raspberry Pi, sudo hub-install.sh upgrade installs it.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v2.1.0"
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    name: Build and attach the package
    runs-on: ubuntu-latest
    permissions:
      contents: write        # uploads to the release
      id-token: write        # artifact attestation
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the tag
        run: '[[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }'
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: hub
      - name: Build the package
        run: bash .github/scripts/build-package.sh "${TAG#v}" dist
      - uses: actions/attest@v4.2.2
        with:
          subject-path: dist/raspberry-hub-*.tar.gz
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
