# raspberry-hub settings. Read by hub-update.sh (syntax: VARIABLE=value, no spaces).
# Nothing needs restarting after a change: it applies from the next update.

# Offline Wikipedia: language (as Kiwix names it: it, en, de, fr, es...) and variant. Chosen when the hub is
# installed; sudo hub-install.sh configure shows the size of each and changes them (or edit them here, then
# sudo hub-update.sh wiki: the previous edition goes once the new one is installed and verified).
# Several languages, for a home where people read different ones: WIKI_LANGUAGE=it,en, each with its own variant
# if it differs from WIKI_VARIANT (it:maxi,en:nopic). The hub opens the one of the language of each browser.
#   maxi  = all articles with images (Italian: about 30 GB)
#   nopic = all articles without images (about 8 GB)
#   mini  = only the introduction of each article (about 3 GB)
WIKI_LANGUAGE=it
WIKI_VARIANT=maxi

# Map and address search: the country, as an ISO 3166 code of countries.json. Chosen when the hub is installed;
# sudo hub-install.sh configure changes it, with MAP_BBOX, ADDRESS_DUMP_URL and ADDRESS_LANGUAGES below.
# It is a place, not a language: it changes neither the language of the hub nor the Wikipedia edition.
MAP_COUNTRY=IT

# Maps: box to download (west,south,east,north) and maximum detail (15 = street level). A box of your own works
# too: write it here, then sudo hub-update.sh maps.
MAP_BBOX=6.6,35.4,18.6,47.2
MAP_MAXZOOM=15

# Addresses: weekly Photon/Nominatim dump of the country (OpenStreetMap data).
ADDRESS_DUMP_URL=https://download1.graphhopper.com/public/europe/italy/photon-dump-italy-1.0-latest.jsonl.zst

# The languages of the street names in that dump (it, fr, es, pt, de, nl, en, separated by commas), so that the
# address search knows "via", "rue", "straße" and their abbreviations. Empty: plain words only.
ADDRESS_LANGUAGES=it

# Maps and addresses are rebuilt only when the installed ones are at least this many days old.
MIN_AGE_DAYS=20

# Content folder.
HUB_DIR=/srv/hub

# New versions: once a day the Raspberry Pi asks GitHub which is the latest release (GitHub sees only the
# public address of your home, as for the map downloads), and the hub says when a newer one is out.
# no = never ask.
CHECK_FOR_UPDATES=yes

# A message when a new version comes out, besides the notice in the hub: netmon (Telegram, with the pi-setup
# package) or the address of an ntfy topic (https://ntfy.sh/a-name-only-you-know). Empty = no message.
NOTIFY_NEW_VERSION=

# Hardware watchdog: yes = a Raspberry Pi that hangs reboots by itself after about 15 seconds (systemd tells
# the watchdog of the board that all is well, and stops when it cannot). Apply a change with:
# sudo hub-install.sh watchdog
WATCHDOG=no
