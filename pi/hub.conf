# Impostazioni dell'hub di casa. Lette da hub-update.sh (sintassi: VARIABILE=valore, senza spazi).
# Dopo una modifica non serve riavviare nulla: vale dal prossimo aggiornamento.

# Wikipedia offline: lingua e variante.
#   maxi  = tutte le voci con immagini (italiano: circa 30 GB)
#   nopic = tutte le voci senza immagini (circa 8 GB)
#   mini  = solo l'introduzione di ogni voce (circa 3 GB)
WIKI_LINGUA=it
WIKI_VARIANTE=maxi

# Mappe: rettangolo da scaricare (ovest,sud,est,nord) e dettaglio massimo (15 = livello strada).
MAPPE_BBOX=6.6,35.4,18.6,47.2
MAPPE_MAXZOOM=15

# Indirizzi: dump settimanale Photon/Nominatim dell'Italia (dati OpenStreetMap).
DUMP_INDIRIZZI=https://download1.graphhopper.com/public/europe/italy/photon-dump-italy-1.0-latest.jsonl.zst

# Mappe e indirizzi vengono rifatti solo se quelli installati hanno almeno questi giorni.
GIORNI_MINIMI=20

# Cartella dei contenuti.
HUB_DIR=/srv/hub
