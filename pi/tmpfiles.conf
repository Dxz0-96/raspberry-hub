# raspberry-hub (installed as /etc/tmpfiles.d/raspberry-hub.conf by hub-install.sh).
# At boot no content update can still be running: the markers of one that was killed (a power cut, out of memory
# during the index build) are removed, so the hub stops showing "download in progress" and the "Update" button
# stops refusing. The update itself resumes at its next run.
r /srv/hub/state/*.running
